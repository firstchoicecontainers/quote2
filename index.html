<!DOCTYPE html>
<html lang="en">
<head>

<title>First Choice Containers</title>

<style>
html,body{
    margin:0;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ffffff;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    text-align:center;
}

.logo{
    font-size:34px;
    font-weight:bold;
    margin-bottom:20px;
}

.first{
    color:#0078D4;
}

.containers{
    color:#E53935;
}

.spinner{
    width:48px;
    height:48px;
    margin:20px auto;
    border:4px solid #ddd;
    border-top:4px solid #0078D4;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

.text{
    color:#555;
    font-size:16px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>

</div>

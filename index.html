<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>First Choice Containers</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#ffffff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    text-align:center;
    padding:20px;
    width:100%;
}

.company-logo{
    width:360px;
    max-width:90%;
    height:auto;
    display:block;
    margin:0 auto 30px;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
}

.spinner{
    width:56px;
    height:56px;
    margin:0 auto 20px;
    border:5px solid #e6e6e6;
    border-top:5px solid #2F62D8;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

.loading-text{
    font-size:18px;
    color:#555;
    font-weight:600;
}

.loading-subtext{
    margin-top:8px;
    color:#888;
    font-size:14px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media (max-width:600px){

.company-logo{
    width:260px;
}

.spinner{
    width:46px;
    height:46px;
}

.loading-text{
    font-size:16px;
}

.loading-subtext{
    font-size:13px;
}

}
</style>

</head>

<body>

<div class="container">

    <img
        src="logo.png"
        alt="First Choice Containers"
        class="company-logo">

    <div class="spinner"></div>

    <div class="loading-text">
        Opening Application...
    </div>

    <div class="loading-subtext">
        Please wait while we connect securely.
    </div>

</div>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxwbVlUeJxYeM0ZJi8fD-CseissJBsEtOquUnWm3KzolPx80lHJrU7Eb7LvasWQeJWI/exec";

// Preserve all parameters coming from AppSheet
const destination = APPS_SCRIPT_URL + window.location.search;

// Let the browser paint the logo first, then redirect immediately
requestAnimationFrame(() => {
    requestAnimationFrame(() => {
        window.location.replace(destination);
    });
});

</script>

</body>
</html>
